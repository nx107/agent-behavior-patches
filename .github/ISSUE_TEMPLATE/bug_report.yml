name: Bug report
description: Report a reproducible defect in schemas, validation, evaluation, or CLI behavior.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets or real user traces. Security issues belong in the private process in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include synthetic input, exact commands, output, and exit codes.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node and pnpm versions
      placeholder: "Node 20.x; pnpm 11.x"
    validations:
      required: true
  - type: dropdown
    id: provenance
    attributes:
      label: Data provenance
      options:
        - Synthetic fixture only
        - Public non-sensitive fixture
    validations:
      required: true
