name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Node 20 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Regenerate schemas and reject drift
        run: pnpm schemas:check
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
      - name: Full quality gate
        run: pnpm check
      - name: CLI validate
        run: node dist/cli.js validate patches/verify-before-claim --json
      - name: CLI test
        run: node dist/cli.js test patches/verify-before-claim --json
      - name: CLI compare
        run: node dist/cli.js compare patches/verify-before-claim/fixtures/baseline/claim-without-command.yaml patches/verify-before-claim/fixtures/patched/claim-without-command.yaml --patch patches/verify-before-claim/patch.yaml --json
      - name: Invalid input must exit nonzero
        shell: bash
        run: |
          if node dist/cli.js validate test/fixtures/invalid-trace.yaml --json; then
            echo "invalid input unexpectedly exited zero" >&2
            exit 1
          fi
      - name: Package dry run
        run: pnpm pack --dry-run
